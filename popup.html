<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 480px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 16px;
      color: #222;
      background: #fafafa;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #0078d4;
    }
    .section {
      margin-bottom: 14px;
    }
    .label {
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .value {
      word-break: break-all;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px 10px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
      color: #333;
      max-height: 120px;
      overflow-y: auto;
    }
    .value.empty {
      color: #999;
      font-style: italic;
      background: #f5f5f5;
    }
    .match-info {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
    }
    .match-info.matched {
      background: #dff6dd;
      border: 1px solid #9fd89f;
      color: #1a7a1a;
    }
    .match-info.no-match {
      background: #fff4ce;
      border: 1px solid #e8d48a;
      color: #7a6500;
    }
    .no-data {
      color: #888;
      font-style: italic;
      padding: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>Auto Login Hint Injector</h3>
  <div id="content">
    <div class="no-data">Analysing current tab...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
